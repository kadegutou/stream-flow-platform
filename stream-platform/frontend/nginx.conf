server {
    listen 80;
    server_name _;

    # 上传/大报文余量
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API 反代到控制面。
    # proxy_pass 不带 URI 部分（末尾无 / 也无路径）：原始请求路径 /api/xxx 原样透传，
    # 即 /api/auth/login → http://control-plane:8080/api/auth/login
    location /api/ {
        proxy_pass http://control-plane:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # JWT 认证头透传（nginx 默认即透传，显式声明防止误改）
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 60s;
    }

    # 前端路由为 history 模式（BrowserRouter）：所有非文件路径 fallback 到 index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
