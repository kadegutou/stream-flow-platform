server:
  port: 8081

spring:
  application:
    name: sp-worker

# 日志同时写文件（控制面在线查看 Worker 日志用）
logging:
  file:
    name: logs/worker.log

sp:
  # 控制面地址
  control-plane-url: http://localhost:8080
  # Worker 内部接口共享密钥头 X-Worker-Token
  worker-token: dev-token
  # 节点标识，默认 hostname-pid，可用环境变量 WORKER_NODE_CODE 覆盖
  worker:
    node-code: ""
